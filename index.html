<!DOCTYPE html>
<html lang="id" class="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buku Kas Guru</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#000000">
<style>
:root{--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#b45309;--ok:#059669;--no:#e11d48}
.dark{--bg:#07090e;--c:#0d111a;--t:#f1f5f9;--m:#94a3b8;--b:#1f2937;--g:#fbbf24;--ok:#34d399;--no:#fb7185}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
.hl{display:flex;align-items:center;gap:10px;min-width:0}.hl small{display:block;color:var(--m)}
.lg{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#050505;display:inline-block}.lg svg{width:100%;height:100%}
.hb,.bar,.row,.ch{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--t)}
button{padding:7px 11px;border:1px solid var(--b);border-radius:9px;background:var(--c);cursor:pointer}
button.pri,button.wa{background:var(--g);color:#111;border-color:var(--g);font-weight:700}button.wa{background:#059669;color:#fff;border-color:#059669}
button.ok{color:var(--ok)}button.no{color:var(--no)}
main{max-width:1000px;margin:0 auto;padding:14px}.bar{justify-content:space-between;margin-bottom:12px}
select,input{padding:8px 10px;border:1px solid var(--b);border-radius:9px;background:var(--bg)}
.seg button{border-radius:0}.seg button:first-child{border-radius:9px 0 0 9px}.seg button:last-child{border-radius:0 9px 9px 0}.seg .on{background:var(--g);color:#111}
.badge{color:var(--m);font-size:12px;border:1px dashed var(--b);padding:5px 9px;border-radius:9px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px}
.hero{border-color:var(--g);margin-bottom:12px}.big{font-size:30px;font-weight:800;color:var(--g);margin:4px 0}
.bar2{height:7px;background:var(--b);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--g);width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.grid b{display:block;font-size:17px}
small,.m{color:var(--m)}.ok{color:var(--ok)}.no{color:var(--no)}.r{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.ch{justify-content:space-between;margin-bottom:8px}h2,h3{margin:0}h2{font-size:16px}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--b)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td{padding:8px 6px;border-top:1px solid var(--b);vertical-align:top}
#q{width:100%;margin-bottom:6px}.ft{margin:10px 0 0}
.rc{max-width:640px;margin:0 auto;background:#fff;color:#0f172a;padding:28px;border:1px solid #cbd5e1;border-radius:14px}
.rh{text-align:center;border-bottom:2px solid #0f172a;padding-bottom:12px;margin-bottom:14px}.rh .lg{width:56px;height:56px;display:block;margin:0 auto 6px}.rh small{display:block;color:#64748b}.rh h2{text-decoration:underline;margin-top:8px;font-size:22px}
.rc h3{text-decoration:underline;margin:16px 0 6px}.rl{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.rl>:nth-child(2){color:#94a3b8}.rl>:last-child{text-align:right}
.tot{border-top:2px dashed #cbd5e1;margin-top:8px;font-weight:800}.fin{display:flex;justify-content:space-between;background:#0f172a;color:#fcd34d;padding:12px 14px;border-radius:12px;font-weight:800;font-size:18px;margin-top:18px}
.sg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;color:#64748b}.sg div{width:150px;text-align:center}.sg hr{margin:34px 0 0;border:0;border-top:1px solid #94a3b8}
.mo{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.mo.on{display:flex}
.md{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;width:100%;max-width:400px}.md form{display:grid;gap:10px;margin-top:12px}.md label{display:grid;gap:4px;font-weight:600}
.md .row{justify-content:flex-end}
#tt{position:fixed;bottom:14px;right:14px;display:grid;gap:6px;z-index:20}#tt div{background:var(--g);color:#111;padding:9px 13px;border-radius:11px;font-weight:700}#tt .e{background:var(--no);color:#fff}
footer{text-align:center;color:var(--m);font-size:12px;padding:16px}
@media print{body{background:#fff}.np{display:none!important}main{padding:0}.rc{border:0;padding:0}@page{margin:1.2cm}}

body{background:radial-gradient(at 0 0,rgba(245,158,11,.12),transparent 45%),radial-gradient(at 100% 0,rgba(16,185,129,.10),transparent 45%),var(--bg);background-attachment:fixed}
header{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--c) 86%,transparent)}
.lg{box-shadow:0 0 0 2px var(--g),0 8px 20px -8px var(--g)}
button{transition:.15s;font-weight:600}button:hover{transform:translateY(-1px);border-color:var(--g)}
button.pri{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#1a1200}
.card{box-shadow:0 14px 34px -16px rgba(0,0,0,.45);border-radius:18px}
.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--g) 16%,var(--c)));position:relative;overflow:hidden;padding:20px}
.hero:before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--g);opacity:.16;filter:blur(30px)}
.big{font-size:clamp(30px,9vw,46px);font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.02em}
.grid .card{border-left:4px solid var(--g)}.grid .card:nth-child(2){border-left-color:var(--ok)}.grid .card:nth-child(4){border-left-color:var(--no)}
.grid b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px}
h2{font-size:17px}.it{align-items:center}
tr:hover td{background:color-mix(in srgb,var(--g) 7%,transparent)}
select{font-weight:700}.seg button{font-weight:700}
@media(max-width:640px){header{flex-direction:column;align-items:stretch}.hb{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.hb button{white-space:nowrap;padding:6px 10px;font-size:13px}.seg{width:100%;display:flex}.seg button{flex:1}main{padding:10px}}
</style></head><body>

<main>
<div class="bar np"><div class="row"><select id="ps" onchange="sw(this.value)"></select><span class="row" id="pa"></span></div>
<span class="seg"><button id="vd" onclick="setView('dash')">📊 Dashboard</button><button id="vb" onclick="setView('book')">📒 Buku Kas</button></span></div>
<section id="vw" class="np"></section>
<section id="dash" class="np">
<div class="card hero"><small>Saldo akhir bersih · <span id="hp"></span></small><div class="big" id="sa"></div><div class="bar2"><i id="ub"></i></div><small id="ur"></small></div>
<div class="grid"><div class="card"><small>🏦 Saldo awal</small><b id="si"></b></div><div class="card"><small>📥 Pemasukan</small><b class="ok" id="sp"></b></div><div class="card"><small>💰 Total dana</small><b id="sd"></b></div><div class="card"><small>🧾 Pengeluaran</small><b class="no" id="sk"></b></div></div>
<div class="two">
<div class="card"><div class="ch"><h2>📥 Pemasukan kas</h2><span id="ia"></span></div><div id="il"></div><div class="it"><b>Total pemasukan</b><b class="ok" id="it"></b></div></div>
<div class="card"><div class="ch"><h2>📤 Pengeluaran kas</h2><span id="ea"></span></div><input id="q" placeholder="Cari nama, keterangan, tanggal" oninput="render()"><div class="tw"><table><tbody id="et"></tbody></table></div><p class="ft">Total: <b class="no" id="f1"></b> · Saldo akhir: <b id="f2"></b></p></div>
</div><div class="card" id="mc" style="margin-top:12px"></div><div class="card" id="rk" style="margin-top:12px"></div></section>
<section id="book" hidden><div id="rc" class="rc"></div></section>
</main>
<footer class="np" id="fo"></footer>
<div id="m" class="mo np" onclick="if(event.target===this)closeM()"><div class="md"><h3 id="mt"></h3><form id="mf"></form></div></div>
<div id="tt" class="np"></div>

let local=false,S=null,cur='',PW=sessionStorage.getItem('kas_pw')||'',admin=false,view='book';
const P=()=>S.periods.find(p=>p.id===cur)||S.periods[0];
function M(p){const x0=S.periods.indexOf(p),i=p.auto&&x0>0?M(S.periods[x0-1]).fin:(+p.init||0),ti=p.inc.reduce((a,x)=>a+(+x.amt||0),0),te=p.exp.reduce((a,x)=>a+(+x.amt||0),0),av=i+ti;return{i,ti,te,av,fin:av-te,ratio:av>0?Math.min(100,Math.round(te/av*100)):0}}
function toast(t,e){const d=document.createElement('div');d.textContent=t;if(e)d.className='e';$('tt').append(d);setTimeout(()=>d.remove(),3000)}
function dl(d,n,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:ty}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function theme(){const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('kas_theme',d?'d':'l')}catch{}}
try{if(localStorage.getItem('kas_theme')==='l')document.documentElement.classList.remove('dark')}catch{}
function setView(v){view=v;$('dash').hidden=v!=='dash';$('book').hidden=v!=='book';$('vd').className=v==='dash'?'on':'';$('vb').className=v==='book'?'on':''}
function openM(){$('m').classList.add('on')}function closeM(){$('m').classList.remove('on')}
function form(t,fs,ok){$('mt').textContent=t;$('mf').innerHTML=fs.map(f=>`<label>${f.l}<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" required ${f.t==='number'?'step="any"':''} ${f.min!=null?`min="${f.min}"`:''} placeholder="${esc(f.p||'')}"></label>`).join('')+'<div class="row"><button type="button" onclick="closeM()">Batal</button><button class="pri">Simpan</button></div>';
$('mf').onsubmit=e=>{e.preventDefault();const o={};fs.forEach(f=>o[f.k]=$('f_'+f.k).value.trim());closeM();ok(o)};openM()}

function logout(){PW='';admin=false;local=false;sessionStorage.removeItem('kas_pw');setView('book');render()}
function backup(){$('mt').textContent='Backup & ekspor';$('mf').onsubmit=null;$('mf').innerHTML='<button type="button" onclick="csv()">Ekspor laporan periode ini (.CSV untuk Excel)</button><button type="button" onclick="csv(1)">Ekspor periode ini (.XLSX)</button><button type="button" onclick="bak()">Backup semua bulan (.JSON)</button><button type="button" onclick="logV()">Riwayat perubahan</button><button type="button" onclick="pwF()">Ganti password</button><label>Pulihkan dari file .JSON (menimpa semua data)<input type="file" accept=".json" onchange="restore(event)"></label><div class="row"><button type="button" onclick="closeM()">Selesai</button></div>';openM()}
function csv(x){const p=P(),m=M(p),f=v=>typeof v==='number'?v:'"'+String(v).replace(/"/g,'""')+'"';
const r=[[S.title.toUpperCase()],['Periode',p.name],[],['Saldo Awal','',m.i],[],['PEMASUKAN'],['No','Sumber','Nominal'],...p.inc.map((x,i)=>[i+1,x.src,+x.amt]),['','Total Pemasukan',m.ti],['','Total Dana',m.av],[],['PENGELUARAN'],['Tanggal','Penerima','Keterangan','Nominal'],...p.exp.map(x=>[x.date,x.title,x.note||'',+x.amt]),['','','Total Pengeluaran',m.te],[],['SALDO AKHIR','','',m.fin]];
if(x){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'Kas');XLSX.writeFile(wb,'Laporan-Kas-'+p.name.replace(/\s+/g,'-')+'.xlsx');return}
dl('\ufeff'+r.map(a=>a.map(f).join(';')).join('\r\n'),'Laporan-Kas-'+p.name.replace(/\s+/g,'-')+'.csv','text/csv;charset=utf-8')}
function bak(){dl(JSON.stringify(S,null,2),'Backup-BukuKasGuru-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Backup diunduh')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.periods)||!d.periods.length)throw 0;
d.periods=d.periods.map(p=>p.incomes?{id:p.id,name:p.name,init:p.initialBalance,inc:p.incomes.map(x=>({id:x.id,src:x.source,amt:x.amount})),exp:p.expenses.map(x=>({id:x.id,date:x.date,title:x.title,note:x.note,amt:x.amount}))}:p);
if(!d.periods.every(p=>Array.isArray(p.inc)&&Array.isArray(p.exp)))throw 0;d.title=d.title||d.brandTitle||'Buku Kas Guru';d.sub=d.sub||d.brandSubtitle||'';d.active=d.active||d.activePeriodId;
if(!confirm('Timpa SEMUA data di server dengan file ini?'))return;closeM();S=d;cur=d.periods.some(x=>x.id===d.active)?d.active:d.periods[0].id;S.active=cur;save();render()}catch{toast('File backup tidak valid','e')}};r.readAsText(f);e.target.value=''}
function prn(){setView('book');setTimeout(()=>print(),150)}
async function share(){const p=P(),m=M(p);toast('Menyiapkan gambar struk…');const c=$('rc').cloneNode(true);c.style.cssText='position:fixed;left:-9999px;top:0;width:640px';document.body.append(c);
try{const cv=await html2canvas(c,{scale:2,backgroundColor:'#fff'}),b=await new Promise(r=>cv.toBlob(r,'image/png')),n='Struk-Kas-'+p.name.replace(/\s+/g,'-')+'.png',f=new File([b],n,{type:'image/png'}),
tx=`📋 LAPORAN KAS - ${S.title.toUpperCase()}\nPeriode: ${p.name}\nSaldo Akhir: ${rp(m.fin)}`;
if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:tx});else{dl(b,n,'image/png');window.open('https://wa.me/?text='+encodeURIComponent(tx+'\n(Lampirkan gambar struk yang baru diunduh)'),'_blank')}}
catch(e){if(e&&e.name!=='AbortError')toast('Gagal membuat gambar struk','e')}finally{c.remove()}}
(async()=>{if(PW){try{const r=await fetch('/api/data',{method:'POST',headers:{'x-admin':PW}});admin=r.ok;if(!r.ok){PW='';sessionStorage.removeItem('kas_pw')}}catch{}}
setView(admin?'dash':'book');await load();setInterval(()=>{if(!admin&&!document.hidden)load()},60000)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
